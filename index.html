<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>digits-28 · reconhecimento de dígitos manuscritos</title>
<meta name="description" content="Uma rede convolucional treinada no MNIST que reconhece dígitos manuscritos dentro do navegador, sem servidor." />
<meta name="theme-color" content="#f6f4ef" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<style>
:root {
  --papel:    #f6f4ef;
  --carta:    #fffefb;
  --tinta:    #1c1b18;
  --tinta-2:  #6c685f;
  --tinta-3:  #a09b90;
  --regua:    #e4e0d6;
  --trilho:   #eae6dc;
  --acento:   #1f4b45;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--papel);
  color: var(--tinta);
  font: 400 15px/1.6 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

.folha {
  width: 100%;
  max-width: 860px;
  margin-inline: auto;
  padding: 0 28px;
}

/* ── cabeçalho ───────────────────────────────────────────── */
header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 34px 0 0;
}
.marca {
  font: 400 21px/1 'Instrument Serif', Georgia, serif;
  letter-spacing: .01em;
}
.marca em { font-style: italic; color: var(--tinta-2); }
.sub {
  font-size: 13px;
  color: var(--tinta-3);
  margin-left: auto;
  text-align: right;
}

.risco { height: 1px; background: var(--regua); margin: 18px 0 34px; }

/* ── mesa de trabalho ────────────────────────────────────── */
main { flex: 1; }

.mesa {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, .82fr);
  gap: 44px;
  align-items: start;
}

.chamada {
  font: 400 17px/1.4 'Instrument Serif', Georgia, serif;
  color: var(--tinta-2);
  margin: 0 0 14px;
}

/* prancheta ------------------------------------------------ */
.prancheta {
  position: relative;
  aspect-ratio: 1;
  background: var(--carta);
  border: 1px solid var(--regua);
  border-radius: 3px;
  touch-action: none;
  cursor: crosshair;
  overflow: hidden;
}
#tela { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.fantasma {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  pointer-events: none;
  font: 400 15px/1 'Inter', sans-serif;
  color: var(--tinta-3);
  transition: opacity .25s;
}
.prancheta[data-usada="sim"] .fantasma { opacity: 0; }

.pe {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 14px;
}

.limpar {
  appearance: none;
  border: 1px solid var(--regua);
  background: var(--carta);
  color: var(--tinta-2);
  font: 500 13px/1 'Inter', sans-serif;
  padding: 9px 15px;
  border-radius: 3px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.limpar:hover { border-color: var(--tinta-3); color: var(--tinta); }
.limpar:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

.dica { font-size: 12.5px; color: var(--tinta-3); }

/* miniatura da entrada do modelo --------------------------- */
.entrada {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 9px;
}
#tela28 {
  width: 38px; height: 38px;
  border: 1px solid var(--regua);
  border-radius: 2px;
  background: var(--carta);
  image-rendering: pixelated;
  display: block;
}
.entrada span { font-size: 11px; line-height: 1.3; color: var(--tinta-3); max-width: 76px; }

/* leitura -------------------------------------------------- */
.digito {
  font: 400 132px/.86 'Instrument Serif', Georgia, serif;
  letter-spacing: -.02em;
  min-height: 114px;
}
.digito.vazio { color: var(--regua); }

.certeza {
  margin-top: 10px;
  font-size: 14px;
  color: var(--tinta-2);
  min-height: 22px;
}
.certeza b { color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }

.barras { margin-top: 26px; border-top: 1px solid var(--regua); padding-top: 16px; }

.linha {
  display: grid;
  grid-template-columns: 13px minmax(0, 1fr) 46px;
  align-items: center;
  gap: 12px;
  padding: 5px 0;
}
.linha .d {
  font-size: 12.5px;
  color: var(--tinta-3);
  font-variant-numeric: tabular-nums;
}
.trilha { height: 5px; border-radius: 3px; background: var(--trilho); overflow: hidden; }
.fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 3px;
  background: var(--tinta-3);
  transition: width .3s cubic-bezier(.2,.8,.3,1), background .2s;
}
.linha .pct {
  font-size: 12px;
  color: var(--tinta-3);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.linha[data-topo="sim"] .d   { color: var(--tinta); font-weight: 600; }
.linha[data-topo="sim"] .fill { background: var(--acento); }
.linha[data-topo="sim"] .pct { color: var(--tinta); font-weight: 500; }

/* ── rodapé ──────────────────────────────────────────────── */
footer { margin-top: 54px; padding-bottom: 40px; }
footer .risco { margin-bottom: 16px; }
.notas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  font-size: 12.5px;
  color: var(--tinta-3);
}
.notas b { color: var(--tinta-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.notas a { color: var(--tinta-2); text-decoration: none; border-bottom: 1px solid var(--regua); }
.notas a:hover { color: var(--tinta); border-color: var(--tinta-3); }
.notas .fim { margin-left: auto; }

/* ── responsivo ──────────────────────────────────────────── */
@media (max-width: 620px) {
  .folha { padding: 0 20px; }
  .mesa { grid-template-columns: 1fr; gap: 30px; }
  /* em coluna única o canvas não pode crescer até empurrar a previsão
     para fora da tela */
  .prancheta { max-width: 380px; }
  .digito { font-size: 104px; min-height: 90px; }
  header { padding-top: 26px; }
  .sub { display: none; }
  .notas .fim { margin-left: 0; }
}

@media (max-width: 560px) {
  .dica { display: none; }   /* some antes de espremer o resto da linha */
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .001ms !important; }
}
</style>
</head>

<body>

<div class="folha">
  <header>
    <span class="marca">digits<em>-</em>28</span>
    <span class="sub" id="estado">carregando o modelo…</span>
  </header>
  <div class="risco"></div>
</div>

<main class="folha">
  <div class="mesa">

    <section>
      <p class="chamada">Desenhe um dígito de 0 a 9.</p>

      <div class="prancheta" id="prancheta" data-usada="nao">
        <canvas id="tela"></canvas>
        <div class="fantasma">o traço aparece aqui</div>
      </div>

      <div class="pe">
        <button class="limpar" id="limpar">Limpar</button>
        <span class="dica">mouse, dedo ou caneta</span>
        <span class="entrada">
          <canvas id="tela28" width="28" height="28" aria-label="Entrada 28×28 enviada ao modelo"></canvas>
          <span>entrada do modelo</span>
        </span>
      </div>
    </section>

    <section aria-live="polite">
      <div class="digito vazio" id="digito">—</div>
      <div class="certeza" id="certeza"></div>

      <div class="barras" id="barras"></div>
    </section>

  </div>
</main>

<footer class="folha">
  <div class="risco"></div>
  <div class="notas">
    <span><b id="n-acuracia">—</b> de acurácia no MNIST</span>
    <span><b id="n-params">—</b> parâmetros</span>
    <span><b id="n-peso">—</b> baixados uma vez</span>
    <span class="fim">
      <a href="https://github.com/hugbrl09/digits-28" target="_blank" rel="noopener">relatório e código no GitHub</a>
    </span>
  </div>
</footer>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   digits-28 — CNN treinada no MNIST, rodando no navegador.
   Sem framework e sem build.
   ════════════════════════════════════════════════════════════════════ */

const $ = (s) => document.querySelector(s);
const limitar = (v, a, b) => Math.min(b, Math.max(a, v));
const nBR = (v, d = 0) => v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });

/* ── telas ─────────────────────────────────────────────────────────
   Duas telas. A visível é tinta escura sobre papel, porque é o que
   parece natural desenhar. A que o modelo lê é branca sobre preta, que
   é o formato do MNIST. Separar as duas evita que qualquer escolha
   visual acabe entrando no tensor.                                   */
const TINTA_N = 280;

const telaVis = $('#tela');
const ctxVis  = telaVis.getContext('2d');

const telaTinta = document.createElement('canvas');
telaTinta.width = telaTinta.height = TINTA_N;
const ctxTinta = telaTinta.getContext('2d', { willReadFrequently: true });

const ctx28 = $('#tela28').getContext('2d');

let tracos = [];          // coordenadas normalizadas 0..1: sobrevivem a redimensionamento
let tracoAtual = null;
const ESPESSURA = 0.075;

function ajustarTela() {
  const r = telaVis.getBoundingClientRect();
  const dpr = limitar(devicePixelRatio || 1, 1, 2.5);
  const l = Math.round(r.width * dpr);
  if (l && telaVis.width !== l) telaVis.width = telaVis.height = l;
  desenharVisivel();
}

function tracarCaminho(ctx, pts, escala) {
  if (!pts.length) return;
  ctx.beginPath();
  if (pts.length === 1) {
    ctx.arc(pts[0].x * escala, pts[0].y * escala, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fill();
    return;
  }
  ctx.moveTo(pts[0].x * escala, pts[0].y * escala);
  // curva pelos pontos médios: suaviza o traço sem deformá-lo
  for (let i = 1; i < pts.length - 1; i++) {
    ctx.quadraticCurveTo(
      pts[i].x * escala, pts[i].y * escala,
      (pts[i].x + pts[i + 1].x) / 2 * escala, (pts[i].y + pts[i + 1].y) / 2 * escala,
    );
  }
  const u = pts[pts.length - 1];
  ctx.lineTo(u.x * escala, u.y * escala);
  ctx.stroke();
}

function desenharVisivel() {
  const L = telaVis.width;
  ctxVis.clearRect(0, 0, L, L);
  ctxVis.lineCap = ctxVis.lineJoin = 'round';
  ctxVis.strokeStyle = '#1c1b18';
  for (const t of tracos) {
    ctxVis.lineWidth = ESPESSURA * L;
    tracarCaminho(ctxVis, t, L);
  }
}

function desenharTinta() {
  ctxTinta.fillStyle = '#000';
  ctxTinta.fillRect(0, 0, TINTA_N, TINTA_N);
  ctxTinta.lineCap = ctxTinta.lineJoin = 'round';
  ctxTinta.strokeStyle = '#fff';
  for (const t of tracos) {
    ctxTinta.lineWidth = ESPESSURA * TINTA_N;
    tracarCaminho(ctxTinta, t, TINTA_N);
  }
}

function redesenhar() {
  desenharVisivel();
  desenharTinta();
  $('#prancheta').dataset.usada = tracos.length ? 'sim' : 'nao';
}

/* ── ponteiro ─────────────────────────────────────────────────────── */
const prancheta = $('#prancheta');

function posicao(ev) {
  const r = telaVis.getBoundingClientRect();
  return { x: limitar((ev.clientX - r.left) / r.width, 0, 1), y: limitar((ev.clientY - r.top) / r.height, 0, 1) };
}

prancheta.addEventListener('pointerdown', (ev) => {
  if (ev.button) return;
  prancheta.setPointerCapture(ev.pointerId);
  tracoAtual = [posicao(ev)];
  tracos.push(tracoAtual);
  redesenhar();
  agendar();
});

prancheta.addEventListener('pointermove', (ev) => {
  if (!tracoAtual) return;
  const p = posicao(ev);
  const u = tracoAtual[tracoAtual.length - 1];
  if (Math.hypot(p.x - u.x, p.y - u.y) < 0.004) return;   // descarta tremor
  tracoAtual.push(p);
  redesenhar();
  agendar();
});

function soltar() {
  if (!tracoAtual) return;
  tracoAtual = null;
  prever();
}
prancheta.addEventListener('pointerup', soltar);
prancheta.addEventListener('pointercancel', soltar);
prancheta.addEventListener('pointerleave', soltar);

function limpar() {
  tracos = [];
  tracoAtual = null;
  redesenhar();
  zerar();
}
$('#limpar').addEventListener('click', limpar);

/* ── pré-processamento no padrão MNIST ────────────────────────────────
   O MNIST não guarda o dígito como a pessoa desenhou: cada imagem foi
   recortada, reescalada para caber em 20×20 e recolocada em 28×28 com o
   centro de massa no meio. Repetir isso é o que faz o modelo funcionar
   quando o dígito é desenhado pequeno, torto ou no canto.             */
const LIMIAR = 24;
const CAIXA  = 20;

function preprocessar() {
  const px = ctxTinta.getImageData(0, 0, TINTA_N, TINTA_N).data;

  const cinza = new Float32Array(TINTA_N * TINTA_N);
  let x0 = TINTA_N, y0 = TINTA_N, x1 = -1, y1 = -1;
  for (let y = 0; y < TINTA_N; y++) {
    for (let x = 0; x < TINTA_N; x++) {
      const i = y * TINTA_N + x;
      const v = px[i * 4];                 // tinta branca sobre preto: o canal R basta
      cinza[i] = v;
      if (v > LIMIAR) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return null;

  const larg = x1 - x0 + 1, alt = y1 - y0 + 1;
  const fator = CAIXA / Math.max(larg, alt);
  const cw = limitar(Math.round(larg * fator), 1, CAIXA);
  const ch = limitar(Math.round(alt  * fator), 1, CAIXA);

  // média por área: numa redução de ~14× o reamostrador do navegador
  // descarta pixels e o traço chega picotado à rede
  const recorte = new Float32Array(cw * ch);
  for (let j = 0; j < ch; j++) {
    const ya = y0 + (j * alt) / ch, yb = y0 + ((j + 1) * alt) / ch;
    for (let i = 0; i < cw; i++) {
      const xa = x0 + (i * larg) / cw, xb = x0 + ((i + 1) * larg) / cw;
      let soma = 0, n = 0;
      for (let y = Math.floor(ya); y < Math.max(Math.ceil(yb), Math.floor(ya) + 1); y++) {
        for (let x = Math.floor(xa); x < Math.max(Math.ceil(xb), Math.floor(xa) + 1); x++) {
          soma += cinza[y * TINTA_N + x];
          n++;
        }
      }
      recorte[j * cw + i] = n ? soma / n : 0;
    }
  }

  let massa = 0, mx = 0, my = 0;
  for (let j = 0; j < ch; j++) {
    for (let i = 0; i < cw; i++) {
      const v = recorte[j * cw + i];
      massa += v; mx += v * i; my += v * j;
    }
  }
  const cmx = massa ? mx / massa : (cw - 1) / 2;
  const cmy = massa ? my / massa : (ch - 1) / 2;

  const dx = Math.round(limitar(13.5 - cmx, 0, 28 - cw));
  const dy = Math.round(limitar(13.5 - cmy, 0, 28 - ch));

  const grade = new Float32Array(28 * 28);
  for (let j = 0; j < ch; j++)
    for (let i = 0; i < cw; i++)
      grade[(j + dy) * 28 + (i + dx)] = recorte[j * cw + i];

  return grade;
}

function pintar28(grade) {
  const img = ctx28.createImageData(28, 28);
  for (let i = 0; i < 784; i++) {
    // invertido na miniatura, para combinar com a página: tinta escura sobre papel
    const v = 255 - (grade ? Math.round(grade[i]) : 0);
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx28.putImageData(img, 0, 0);
}

/* ── modelo ───────────────────────────────────────────────────────── */
let modelo = null;

async function carregar() {
  try {
    const resp = await fetch('relatorio.json', { cache: 'no-cache' });
    if (resp.ok) {
      const r = await resp.json();
      $('#n-acuracia').textContent = (r.teste.acuracia * 100).toFixed(2).replace('.', ',') + '%';
      $('#n-params').textContent = nBR(r.params_total);
      $('#n-peso').textContent = nBR(r.tamanho_web_kb / 1024, 1) + ' MB';
    }
  } catch (_) { /* o rodapé fica com travessões */ }

  try {
    modelo = await tf.loadLayersModel('modelo_web/model.json');
    tf.tidy(() => modelo.predict(tf.zeros([1, 28, 28, 1])).dataSync());   // aquece os shaders
    $('#estado').textContent = '';
  } catch (erro) {
    console.error(erro);
    $('#estado').textContent = 'modelo não encontrado';
  }
}

let pendente = false;
let ultima = 0;

function agendar() {
  if (pendente) return;
  pendente = true;
  requestAnimationFrame(() => {
    pendente = false;
    if (performance.now() - ultima > 70) prever();
  });
}

function prever() {
  if (!modelo) return;
  const grade = preprocessar();
  if (!grade) { zerar(); return; }

  pintar28(grade);
  ultima = performance.now();

  const p = tf.tidy(() => modelo.predict(tf.tensor4d(grade, [1, 28, 28, 1]).div(255)).dataSync());
  mostrar(p);
}

/* ── leitura ──────────────────────────────────────────────────────── */
$('#barras').innerHTML = Array.from({ length: 10 }, (_, d) => `
  <div class="linha" id="l${d}">
    <span class="d">${d}</span>
    <span class="trilha"><span class="fill" id="f${d}"></span></span>
    <span class="pct" id="p${d}">0,0%</span>
  </div>`).join('');

function zerar() {
  for (let d = 0; d < 10; d++) {
    $('#f' + d).style.width = '0%';
    $('#p' + d).textContent = '0,0%';
    $('#l' + d).dataset.topo = 'nao';
  }
  const dig = $('#digito');
  dig.textContent = '—';
  dig.classList.add('vazio');
  $('#certeza').textContent = '';
  pintar28(null);
}

function mostrar(p) {
  let topo = 0;
  for (let d = 1; d < 10; d++) if (p[d] > p[topo]) topo = d;

  for (let d = 0; d < 10; d++) {
    $('#f' + d).style.width = (p[d] * 100).toFixed(2) + '%';
    $('#p' + d).textContent = nBR(p[d] * 100, 1) + '%';
    $('#l' + d).dataset.topo = d === topo ? 'sim' : 'nao';
  }

  const dig = $('#digito');
  dig.textContent = String(topo);
  dig.classList.remove('vazio');
  $('#certeza').innerHTML = `<b>${nBR(p[topo] * 100, 1)}%</b> de certeza`;
}

/* ── exemplos pelas teclas 0–9 ────────────────────────────────────── */
function arco(cx, cy, rx, ry, g0, g1, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (g0 + (g1 - g0) * (i / n)) * Math.PI / 180;
    pts.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
  }
  return pts;
}
const reta = (...p) => p.map(([x, y]) => ({ x, y }));

const EXEMPLOS = {
  0: [arco(0.50, 0.50, 0.135, 0.255, -90, 270, 30)],
  1: [reta([0.40, 0.32], [0.50, 0.245], [0.505, 0.775]), reta([0.40, 0.78], [0.61, 0.78])],
  2: [[...arco(0.500, 0.350, 0.125, 0.115, 160, 350, 18), ...reta([0.615, 0.395], [0.375, 0.750]), ...reta([0.372, 0.762], [0.640, 0.762])]],
  3: [[...arco(0.500, 0.350, 0.110, 0.110, -170, 90, 18), ...arco(0.500, 0.580, 0.125, 0.125, -90, 170, 18)]],
  4: [reta([0.575, 0.235], [0.355, 0.585], [0.665, 0.585]), reta([0.565, 0.395], [0.560, 0.785])],
  5: [[...reta([0.625, 0.245], [0.400, 0.245], [0.378, 0.455]), ...arco(0.505, 0.590, 0.135, 0.150, -105, 120, 20)]],
  6: [[...arco(0.505, 0.500, 0.150, 0.265, -55, -170, 16), ...arco(0.520, 0.640, 0.130, 0.125, 175, 530, 26)]],
  7: [reta([0.355, 0.255], [0.650, 0.250], [0.455, 0.785]), reta([0.400, 0.520], [0.585, 0.510])],
  8: [arco(0.500, 0.340, 0.108, 0.108, -90, 270, 22), arco(0.500, 0.610, 0.132, 0.142, -90, 270, 24)],
  9: [[...arco(0.505, 0.375, 0.125, 0.135, 20, 380, 26), ...reta([0.628, 0.395], [0.575, 0.785])]],
};

addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const alvo = ev.target;
  if (alvo && (alvo.tagName === 'INPUT' || alvo.isContentEditable)) return;

  const k = ev.key;
  if (k >= '0' && k <= '9') {
    ev.preventDefault();
    tracos = EXEMPLOS[k].map((pts) => pts.slice());
    redesenhar();
    prever();
  } else if (k === 'Escape' || k === 'Delete' || k === 'Backspace' || k.toLowerCase() === 'c') {
    ev.preventDefault();
    limpar();
  }
});

/* ── partida ──────────────────────────────────────────────────────── */
zerar();
ajustarTela();
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(ajustarTela).observe(prancheta);
else addEventListener('resize', ajustarTela);
carregar();
</script>
